# 金标问答集（回归门禁基准）
#
# 每条 [[qa]]：
#   id                唯一编号
#   question          用户问题（贴近真实问法）
#   expected_sources  期望命中的数据源 id（检索 top-k 内命中任一即 hit；留空 = 负例）
#   expected_keywords 回答中应出现的关键词（小写；用于生成层关键词覆盖率指标）
#   notes             标注说明（可选）
#   category          评估维度标签（可选）：concept/version/news/multihop/cross_lingual/negative/general
#   timeliness        时效性标签（可选）：stable / time_sensitive
#                     未填写时按问题中的时间线索词（"最近/最新/近期"…）自动推断；
#                     time_sensitive 条目依赖语料新鲜度，会随时间陈旧化（stale eval 风险）。
#
# 维护方式：eval run 跑出的 badcase（data/badcases/*.jsonl）人工复盘后，
# 确认是「系统应答对却没答对」的问题，就追加到这里 —— 这就是 badcase 回流。
# Web 端「质量评估 → badcase 导入」或 CLI `eval import-badcase` 可直接导入。
#
# 治理政策（数据集生命周期）：
#   1. 每季度对评估集做一次体检：`llm-intel-kb eval audit`（或 Web「质量评估」页）。
#   2. 时效敏感条目按季度轮换约 30%：替换为新近的真实问题，或在 notes 记录时间锚点。
#   3. 负例（expected_sources 为空）与「领域守卫」的禁止清单对齐——守卫在检索前拦截，
#      负例在评估层验证「该拒答时确实拒答」，两者共同守住领域边界。
#   4. expected_sources 必须取自 data_sources.toml 中 enabled 的源 id。引用未注册源
#      （如从未启用的 arxiv-cs-cv / arxiv-cs-sd）会让该条 hit@k 恒为 0 —— 这是
#      「评估集本身坏了」而非系统坏了，属于必须拦截的脏数据。
#   5. category 标注评估维度（concept/version/news/multihop/cross_lingual/negative），
#      便于按维度看指标，避免单一总分掩盖结构性短板。

