# === 负例（应拒绝回答的问题，验证系统不会编造答案）===
# expected_sources 留空：检索层可能返回结果（BM25+向量总会给出 top-k），
# 但生成层应基于 system prompt 说"资料不足，无法回答"。
# 关键词覆盖检查回答中是否包含拒绝性表述。
# 双层防护对齐：线上问答会先经「领域守卫」在检索前拦截（拒答话术含"超出…领域范围"），
# 因此负例关键词统一含 不知道/无法/不足/超出/领域，使「守卫拦截」与「生成拒答」两条路径都能判过。

