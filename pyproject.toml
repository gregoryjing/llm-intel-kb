[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-intel-kb"
version = "0.1.0"
description = "AI/LLM 领域情报知识库：数据集生命周期管线 + 工程化 RAG + 评估门禁"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "feedparser>=6.0.11",
    "fastapi>=0.115",
    "httpx2>=2.12",
    "openai>=1.59",
    "pgvector>=0.3.6",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "rich>=13.9",
    "sqlalchemy>=2.0.36",
    "typer>=0.14",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[project.scripts]
llm-intel-kb = "llm_intel_kb.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_intel_kb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: 需要真实数据库或网络服务的集成测试",
]

[tool.ruff]
# 中文按 Unicode 宽度计 2 列，100 过紧；120 覆盖绝大多数中文提示行
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.flake8-bugbear]
# typer 的官方写法就是 Option() 作为参数默认值
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = "feedparser"
ignore_missing_imports = true
